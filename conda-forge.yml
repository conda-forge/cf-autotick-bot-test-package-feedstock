bot:
  automerge: true
conda_forge_output_validation: true
github:
  branch_name: main
  tooling_branch_name: main
conda_build:
  pkg_format: 2
provider:
  linux_64: default
  linux_aarch64: default
  osx_64: default
  osx_arm64: default
  win_64: default
workflow_settings:
  store_build_artifacts: true
