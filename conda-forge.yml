bot:
  automerge: true
conda_forge_output_validation: true
github:
  branch_name: main
  tooling_branch_name: main
conda_build:
  pkg_format: 2
provider:
  linux_64: github_actions
  osx_arm64: azure
# conda-forge-webservices' live tests ask for version updates from this workflow
trusted_publishers:
  - provider: github
    repository: conda-forge/conda-forge-webservices
    repository_owner_id: 11897326
    workflow: tests.yml
